# =====================================================================
# INTENTIONALLY VULNERABLE snmpd configuration -- LAB USE ONLY
# =====================================================================

# --- Network binding ---
agentaddress udp:161

# --- SNMPv1 / v2c community strings (clear-text, default names) ---
# "public"  = read-only  (information disclosure)
# "private" = read-write (configuration tampering + RCE via extend)
rocommunity public  default
rwcommunity private default

sysDescr  "Linux lab-agent 5.15 #1 SMP x86_64"

# --- NET-SNMP-EXTEND-MIB: remote command execution ---
extend  whoami   /usr/bin/whoami
extend  hostname /bin/hostname
