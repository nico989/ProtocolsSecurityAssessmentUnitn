# =====================================================================
# INTENTIONALLY VULNERABLE snmpd configuration -- LAB USE ONLY
# =====================================================================

# listen on UDP port 161 on all interfaces
agentaddress udp:161

# read-only access with community string "public" from any host (information disclosure)
rocommunity public default

# read-write access with community string "private" from any host (configuration tampering + RCE)
rwcommunity private default

# static system description returned by sysDescr OID (1.3.6.1.2.1.1.1.0)
sysDescr "Linux lab-agent 5.15 #1 SMP x86_64"

# pre-loaded extend entry: runs whoami on every SNMP read, output at nsExtendOutput1Line."whoami"
extend whoami /usr/bin/whoami

# pre-loaded extend entry: runs hostname on every SNMP read, output at nsExtendOutput1Line."hostname"
extend hostname /bin/hostname
